<!DOCTYPE html>
<html>
<head>
    <title>Get IP</title>
</head>

<body>

    <button onclick="getIP()">Get ip</button>

    <script>

        function getIP() {

            fetch("https://api.ipify.org/")

            .then(response => response.text())

            .then(data => {
                console.log(data);
            })

            .catch(error => {
                console.log(error);
            });

        }

    </script>

</body>
</html>
